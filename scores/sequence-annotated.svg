<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="266" viewBox="0 0 1170 266" role="img" aria-labelledby="title desc"><title id="title">동형진행: Motive에서 Sequence로</title><desc id="desc">첫 음형 솔 라 시플랫 미플랫과, 한 음 아래로 옮긴 파 솔 라 레 음형의 범위를 괄호로 표시했습니다.</desc><rect width="100%" height="100%" fill="white"/><image x="0" y="105" width="1170" height="156" href="data:image/png;base64,"/><g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle" font-size="24"><text x="437.0" y="39" fill="#79609f">Motive</text><text x="852.5" y="39" fill="#497fa2">Sequence</text></g><g fill="none" stroke-width="3" stroke-linecap="round"><path d="M205 83 V63 H669 V83" stroke="#9b80bc"/><path d="M714 83 V63 H991 V83" stroke="#719eba"/><path d="M512.0 31 H757.5 l-9 -5 m9 5 l-9 5" stroke="#b4a6c3"/></g></svg>